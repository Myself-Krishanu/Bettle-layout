<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <main>
        <header>
            <div class="left-head">
                <div id="insect">
                    <h1>INSECT</h1>
                </div>
                <div id="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">

                </div>
            </div>
            <div class="right-head">
                <nav id="navbar">
                    <a href="">Home</a>
                    <a href="">Shop</a>
                    <a href="">About</a>
                    <a href="">Gallery</a>
                    <a href="">Contact</a>
                </nav>
            </div>
        </header>
        <section>
            <img src="./Screenshot_3-6-2026_84031_www.notion.so-removebg-preview.png" alt="">
            <div class="left-section">
                <div class="classification">
                    <div class="title">
                        <h1>Classification</h1>
                    </div>
                    <div class="details">
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Class:</h3>
                                <p>Insecta</p>
                            </div>
                        </div>
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Order:</h3>
                                <p>Coleoptera</p>
                            </div>
                        </div>
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Family:</h3>
                                <p>Cerambycidae</p>
                            </div>
                        </div>
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Sub-Family:</h3>
                                <p>Cerambycinae</p>
                            </div>
                        </div>
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Tribe:</h3>
                                <p>Callicromatini</p>
                            </div>
                        </div>
                        <div class="item">
                            <span class="dot"></span>
                            <div id="content">
                                <h3>Genus:</h3>
                                <p>Pachyteria</p> 
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="right-section">
                <div class="right-main">
                    <div class="genus-name">
                        <h1>Pashyteria <br> equestris</h1>
                    </div>
                    <div class="bettlecontainer">
                        <div id="bettle-image">
                            <img src="./cockroch-removebg-preview.png" alt="">
                            <span>32mm</span>
                        </div>
                        <div id="bettle-info"></div>
                    </div>
                    <div class="price"></div>
                </div>
                <button>Add to collection</button>
            </div>
        </section>
    </main>
</body>
</html>
